[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=3

[Service]
# Splat Lab shares this personal workstation with interactive and AI workloads.
# Start conservatively; raise the CPU budget only after the hardware stability gate.
Environment=SPLAT_RESUME_ON_START=0
# Systemd affinity is inherited by every pipeline child. Disable the older
# stitch-only taskset because it could replace this safer E-core assignment.
Environment=SPLAT_STITCH_CPUS=0
Environment=OMP_NUM_THREADS=4
Environment=OMP_THREAD_LIMIT=4
Environment=OPENBLAS_NUM_THREADS=4
Environment=MKL_NUM_THREADS=4
Environment=NUMEXPR_NUM_THREADS=4
Environment=NUMEXPR_MAX_THREADS=4

CPUAffinity=8-15
CPUAccounting=yes
CPUQuota=400%
CPUQuotaPeriodSec=10ms
CPUWeight=20
Nice=10

MemoryAccounting=yes
MemoryHigh=32G
MemoryMax=48G
MemorySwapMax=8G
TasksAccounting=yes
TasksMax=512
OOMPolicy=kill

# Every pipeline stage stays in this cgroup even though it starts a new session.
KillMode=control-group
TimeoutStopSec=45s
Restart=on-failure
RestartSec=30s
