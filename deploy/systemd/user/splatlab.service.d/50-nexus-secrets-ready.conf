# nexus-secrets-ready boot-ordering barrier drop-in
# Install target: ~/.config/systemd/user/splatlab.service.d/50-nexus-secrets-ready.conf
# Authored 2026-07-01 by boot-fixes (03-boot-deep-dive.md UNLOCK-01 / UNLOCK-10).
#
# WHY: on every cold boot splatlab used to win a race against nexus-tpm-unlock and
# start ~6s BEFORE /dev/shm/nexus_session existed -> secretless "degraded" start.
# Ordering it After= the secrets-ready gate makes it start ONCE, WITH secrets.
#
# SAFETY: After=/Wants= are ADDITIVE to the unit's existing ordering (they append,
# never override). Wants= (NOT Requires=) means a failed or slow vault unlock
# releases the gate into manual mode instead of blocking splatlab — boot never hangs.
[Unit]
Wants=nexus-secrets-ready.target
After=nexus-secrets-ready.target
